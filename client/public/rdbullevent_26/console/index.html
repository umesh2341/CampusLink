<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CampusLink Red Bull Event 2026 — Live Vehicle Tracking Console by Club Nexus I7">
  <title>CampusLink — Live Red Bull Vehicle Radar</title>
  <style>
    :root {
      --bg: #07090e;
      --card: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --rb-red: #e11d48;
      --rb-yellow: #facc15;
      --mono: 'JetBrains Mono', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HUD overlays ────────────────────────────── */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hud-panel {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 900;
      color: var(--rb-yellow);
      background: rgba(250, 204, 21, 0.1);
      border: 1px solid var(--rb-yellow);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      font-family: var(--mono);
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-green  { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
    .badge-amber  { background: rgba(245, 158, 11, 0.15);  color: #f59e0b; border: 1px solid #f59e0b; }
    .badge-orange { background: rgba(249, 115, 22, 0.15);  color: #f97316; border: 1px solid #f97316; }
    .badge-red    { background: rgba(225, 29, 72, 0.15);   color: #e11d48; border: 1px solid #e11d48; }
    .badge-muted  { background: rgba(30, 41, 59, 0.8);     color: var(--muted); border: 1px solid var(--border); }

    /* ── Map stage ───────────────────────────────── */
    .map-stage {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #090e17;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .svg-container {
      position: relative;
      width: 1580px;
      height: 2891px;
      transform-origin: top left;
    }
    .map-img {
      position: absolute;
      top: 0; left: 0;
      width: 1580px; height: 2891px;
      pointer-events: none;
    }

    /* ── Vehicle marker ──────────────────────────── */
    .vehicle-marker {
      position: absolute;
      top: 0; left: 0;
      width: 0; height: 0;
      z-index: 40;
      display: none;
      pointer-events: none;
    }
    .vehicle-anchor {
      position: relative;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vehicle-pulse {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(225, 29, 72, 0.3);
      animation: carPulse 2s infinite ease-out;
    }
    @keyframes carPulse {
      0%   { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .car-body {
      position: relative;
      width: 38px; height: 38px;
      background: #0f172a;
      border: 2px solid var(--rb-yellow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(225, 29, 72, 0.8);
      z-index: 5;
    }
    .car-pointer {
      position: absolute;
      top: -8px;
      width: 0; height: 0;
      border-left:  6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid var(--rb-yellow);
    }

    /* ── Bottom info card ────────────────────────── */
    .bottom-card {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      font-family: var(--mono);
    }
    .btn-primary { background: var(--rb-red); color: #fff; }
    .btn-stop    { background: #334155; color: #f87171; }

    /* dashed route line animation */
    .route-anim { animation: dashMove 1.5s linear infinite; }
    @keyframes dashMove { to { stroke-dashoffset: -24; } }

    /* ── Connection overlay ──────────────────────── */
    .cfg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 9, 14, 0.95);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .cfg-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
    }
    .cfg-card h2 { font-size: 16px; font-weight: 800; color: var(--rb-yellow); margin-bottom: 4px; }
    .cfg-card p  { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
    .cfg-input   { margin-bottom: 14px; }
    .cfg-input label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .cfg-input input {
      width: 100%;
      background: #05070c;
      border: 1px solid #1e293b;
      color: #fff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
    }
    .cfg-input input:focus { border-color: var(--rb-red); }
    .cfg-btn {
      width: 100%;
      padding: 12px;
      background: var(--rb-red);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- connection screen shown on first load -->
  <div id="cfgOverlay" class="cfg-overlay">
    <div class="cfg-card">
      <h2>Red Bull Live Console</h2>
      <p>Enter your Supabase credentials to connect to the live tracking feed.</p>
      <div class="cfg-input">
        <label>Supabase URL</label>
        <input type="text" id="cfgUrl" placeholder="https://xyz.supabase.co">
      </div>
      <div class="cfg-input">
        <label>Supabase Anon Key</label>
        <input type="password" id="cfgKey" placeholder="eyJhbGciOi...">
      </div>
      <button class="cfg-btn" id="cfgConnect">Connect to Live Feed</button>
    </div>
  </div>

  <div class="top-bar">
    <div class="hud-panel">
      <span class="brand-tag">Red Bull Live</span>
      <span id="statusBadge" class="badge badge-amber">CONNECTING...</span>
    </div>
    <div class="hud-panel">
      <div style="font-size: 12px; font-family: var(--mono);">
        Speed: <strong id="speedText" style="color: var(--rb-yellow);">0.0 km/h</strong>
      </div>
    </div>
  </div>

  <div class="map-stage" id="mapViewport">
    <div class="svg-container" id="mapContainer">
      <img src="/campus-map.svg" class="map-img" alt="ITER Campus Map">

      <!-- SVG layer for accuracy circle + nav route -->
      <svg style="position: absolute; top:0; left:0; width:1580px; height:2891px; pointer-events:none; z-index:30;">
        <circle id="accCircle" cx="0" cy="0" r="20"
          fill="rgba(225,29,72,0.12)" stroke="rgba(225,29,72,0.4)"
          stroke-width="2" stroke-dasharray="6 4" style="display:none;">
        </circle>
        <g id="routeLayer"></g>
      </svg>

      <div id="vehicleMarker" class="vehicle-marker">
        <div class="vehicle-anchor">
          <div class="vehicle-pulse"></div>
          <div id="carBody" class="car-body" style="transition: transform 0.1s linear;">
            <div class="car-pointer"></div>
            <!-- car icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10
                       s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8
                       C2.1 11.2 2 11.7 2 12.2V16c0 .6.4 1 1 1h2"/>
              <circle cx="7" cy="17" r="2"/>
              <path d="M9 17h6"/>
              <circle cx="17" cy="17" r="2"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-card">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
      <div>
        <div style="font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:700; letter-spacing:0.05em;">
          Current Sector
        </div>
        <div id="landmarkText" style="font-size:15px; font-weight:800; color:#fff;">
          Searching Campus Radar...
        </div>
      </div>
      <button id="btnNav" class="btn btn-primary">Take Me To Car</button>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:11px; font-family:var(--mono); color:var(--muted);">
      <span>Telemetry: <span id="telemetryTime" style="color:#cbd5e1;">--</span></span>
      <span id="navHint" style="display:none; color:#38bdf8; font-weight:700;"></span>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

    const DEVICE  = 'REDBULL_CAR_01';
    const MAP_W   = 1580;
    const MAP_H   = 2891;
    const PX_PER_M = 4.6;  // approximate pixels-per-meter for ITER campus SVG

    // stale thresholds — shows DELAYED after 30s, OFFLINE after 2min
    const STALE_MS   = 30_000;
    const OFFLINE_MS = 120_000;

    // throttle: skip updates smaller than this to avoid shimmer
    const JITTER_PX  = 2.5;
    const SMOOTH     = 0.15;
    const SMOOTH_HDG = 0.2;

    // affine transform coefficients — replace with calibration tool output before the event
    const CO = {
      a:  478863.683905,
      b: -19596.875341,
      c: -40689501.705,
      d:  3693.35968,
      e: -499077.146284,
      f:  9789781.4823,
    };

    // known campus landmarks for "Current Sector" label
    const LANDMARKS = [
      { name: 'North Main Gate (LH-5)',    x:  676, y:   48, r: 45 },
      { name: 'BH-7 Hostel',              x:  389, y:  140, r: 40 },
      { name: 'BH-2 Hostel',              x:  590, y:  180, r: 40 },
      { name: 'BH-1 Hostel',              x:  572, y:  366, r: 40 },
      { name: 'Student Section & Admin',   x:  332, y:  446, r: 45 },
      { name: 'Electronics Office',        x:  719, y:  605, r: 35 },
      { name: 'Centre for Data Science',   x:  869, y:  614, r: 45 },
      { name: 'Academic Block',            x:  437, y:  650, r: 60 },
      { name: 'Football Court 1',          x:  709, y:  766, r: 55 },
      { name: 'University Auditorium',     x:  941, y:  794, r: 60 },
      { name: 'C-Block',                   x:  716, y:  961, r: 50 },
      { name: 'Indoor Stadium',            x: 1105, y:  983, r: 55 },
      { name: 'Science Complex (SC-Block)',x:  764, y: 1177, r: 50 },
      { name: 'F-Block',                   x: 1053, y: 1213, r: 50 },
      { name: 'D-Block',                   x:  321, y: 1266, r: 50 },
      { name: 'Central Library',           x:  537, y: 1266, r: 45 },
      { name: 'Gymnasium',                 x:   52, y: 1262, r: 40 },
      { name: 'Food Court Plaza',          x: 1337, y: 1308, r: 65 },
      { name: 'E-Block',                   x:  871, y: 1485, r: 50 },
      { name: 'Cricket Ground',            x:  394, y: 1614, r: 70 },
      { name: 'LH-4 Hostel',              x:  583, y: 1836, r: 45 },
      { name: 'LH-3 Hostel',              x:  847, y: 2143, r: 45 },
      { name: 'BH-5 / BH-8 Hostels',     x: 1302, y: 2436, r: 55 },
      { name: 'South Gate (BH-9)',         x: 1451, y: 2637, r: 50 },
      { name: 'Football Court 2',          x: 1344, y: 2830, r: 60 },
    ];

    function gpsToMap(lat, lng, accuracy) {
      const x = Math.max(0, Math.min(MAP_W, Math.round(CO.a * lng + CO.b * lat + CO.c)));
      const y = Math.max(0, Math.min(MAP_H, Math.round(CO.d * lng + CO.e * lat + CO.f)));
      const r = accuracy != null ? Math.max(8, Math.min(180, Math.round(accuracy * PX_PER_M))) : 24;
      return { x, y, r };
    }

    function resolveLandmark(x, y) {
      if (!isFinite(x) || !isFinite(y)) return 'Location unknown';
      let nearest = null, minD = Infinity;
      for (const lm of LANDMARKS) {
        const d = Math.hypot(x - lm.x, y - lm.y);
        if (d < minD) { minD = d; nearest = lm; }
      }
      if (!nearest) return 'On Campus';
      const m = Math.round(minD / PX_PER_M);
      if (minD <= nearest.r) return `At ${nearest.name}`;
      if (m < 12)             return `Adjacent to ${nearest.name}`;
      if (m < 100)            return `${m}m from ${nearest.name}`;
      return `Heading towards ${nearest.name} (~${m}m)`;
    }

    // angle helpers
    function normalise(a) { return ((a % 360) + 360) % 360; }
    function lerpAngle(cur, tgt, t) {
      let d = normalise(tgt) - normalise(cur);
      if (d >  180) d -= 360;
      if (d < -180) d += 360;
      return normalise(cur + d * t);
    }
    function headingFrom(x1, y1, x2, y2, fallback) {
      const dx = x2 - x1, dy = y2 - y1;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return fallback;
      return normalise((Math.atan2(dx, -dy) * 180) / Math.PI);
    }

    // interpolation state
    let cur = null, tgt = null;

    function setTarget(pt) {
      const hdg = (typeof pt.heading === 'number' && isFinite(pt.heading))
        ? normalise(pt.heading)
        : (cur ? headingFrom(cur.x, cur.y, pt.x, pt.y, cur.heading) : 0);

      tgt = {
        x: pt.x, y: pt.y,
        heading: hdg,
        accR: pt.accR ?? 20,
        speed: pt.speed ?? 0,
        updatedAt: pt.updatedAt ? new Date(pt.updatedAt).getTime() : Date.now(),
      };

      if (!cur) cur = { ...tgt };
    }

    function stepInterp() {
      if (!cur || !tgt) return null;

      const dx = tgt.x - cur.x, dy = tgt.y - cur.y;
      if (dx * dx + dy * dy > JITTER_PX * JITTER_PX) {
        cur.x += dx * SMOOTH;
        cur.y += dy * SMOOTH;
      } else {
        cur.x = tgt.x;
        cur.y = tgt.y;
      }
      cur.heading = lerpAngle(cur.heading, tgt.heading, SMOOTH_HDG);
      cur.accR   += (tgt.accR - cur.accR) * SMOOTH;
      cur.speed   = tgt.speed;

      const elapsed = Date.now() - tgt.updatedAt;
      const status  = elapsed > OFFLINE_MS ? 'OFFLINE'
                    : elapsed > STALE_MS   ? 'DELAYED'
                    : 'LIVE';

      return { ...cur, status };
    }

    // DOM refs
    const ui = {
      mapViewport:  document.getElementById('mapViewport'),
      mapContainer: document.getElementById('mapContainer'),
      marker:       document.getElementById('vehicleMarker'),
      carBody:      document.getElementById('carBody'),
      accCircle:    document.getElementById('accCircle'),
      routeLayer:   document.getElementById('routeLayer'),
      statusBadge:  document.getElementById('statusBadge'),
      landmark:     document.getElementById('landmarkText'),
      speed:        document.getElementById('speedText'),
      telTime:      document.getElementById('telemetryTime'),
      btnNav:       document.getElementById('btnNav'),
      navHint:      document.getElementById('navHint'),
      cfgOverlay:   document.getElementById('cfgOverlay'),
      cfgUrl:       document.getElementById('cfgUrl'),
      cfgKey:       document.getElementById('cfgKey'),
      cfgConnect:   document.getElementById('cfgConnect'),
    };

    // pre-fill from URL params if present (useful for QR codes / shared links)
    const p = new URLSearchParams(window.location.search);
    if (p.get('url')) ui.cfgUrl.value = p.get('url');
    if (p.get('key')) ui.cfgKey.value = p.get('key');

    let supabase = null, rtChannel = null, activeRoute = null;

    // default user position — Academic Block entrance, updated if user shares location later
    const userPos = { x: 437, y: 650 };

    const STATUS_CLASSES = {
      LIVE:     'badge badge-green',
      WEAK_GPS: 'badge badge-amber',
      DELAYED:  'badge badge-orange',
      OFFLINE:  'badge badge-red',
    };

    function setStatus(s) {
      ui.statusBadge.innerText = s;
      ui.statusBadge.className = STATUS_CLASSES[s] ?? 'badge badge-muted';
    }

    function onTelemetry(row) {
      if (!row || typeof row.latitude !== 'number') return;

      const { x, y, r } = gpsToMap(row.latitude, row.longitude, row.accuracy);
      setTarget({
        x, y, r,
        heading:   row.heading   != null ? Number(row.heading)  : null,
        accR:      r,
        speed:     row.speed     != null ? Number(row.speed)    : 0,
        updatedAt: row.updated_at || Date.now(),
      });

      ui.landmark.innerText = resolveLandmark(x, y);
      ui.speed.innerText    = row.speed ? `${(row.speed * 3.6).toFixed(1)} km/h` : '0.0 km/h';
      ui.telTime.innerText  = new Date(row.updated_at || Date.now()).toLocaleTimeString();

      // if user has an active nav route, update it so the line follows the car
      if (activeRoute) drawRoute(x, y);
    }

    async function fetchInitial() {
      if (!supabase) return;
      try {
        // try the public view first (no secret exposed)
        const { data, error } = await supabase
          .from('redbull_car_live')
          .select('*')
          .eq('device_label', DEVICE)
          .maybeSingle();

        if (!error && data) { onTelemetry(data); return; }

        // fallback to raw table if view doesn't exist yet
        const fb = await supabase
          .from('redbull_car_telemetry')
          .select('latitude, longitude, accuracy, altitude, heading, speed, updated_at')
          .eq('device_label', DEVICE)
          .maybeSingle();
        if (fb.data) onTelemetry(fb.data);
      } catch (_e) {}
    }

    function subscribeRT() {
      if (!supabase) return;
      rtChannel = supabase
        .channel('rb-telemetry-live')
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'redbull_car_telemetry',
          filter: `device_label=eq.${DEVICE}`,
        }, payload => {
          if (payload.new) onTelemetry(payload.new);
        })
        .subscribe(status => {
          if (status === 'SUBSCRIBED')   setStatus('LIVE');
          if (status === 'CHANNEL_ERROR') setStatus('OFFLINE');
        });
    }

    function drawRoute(carX, carY) {
      const d = `M ${userPos.x} ${userPos.y} L ${carX} ${carY}`;
      const dist  = Math.max(5, Math.round(Math.hypot(carX - userPos.x, carY - userPos.y) / PX_PER_M));
      const mins  = Math.max(1, Math.ceil(dist / 75));

      ui.routeLayer.innerHTML =
        `<path d="${d}" fill="none" stroke="#e11d48" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="14 10" class="route-anim"/>` +
        `<path d="${d}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;

      ui.navHint.innerText     = `~${dist}m straight-line  (~${mins} min walk)`;
      ui.navHint.style.display = 'block';
      activeRoute = { carX, carY };
    }

    function clearRoute() {
      ui.routeLayer.innerHTML  = '';
      ui.navHint.style.display = 'none';
      activeRoute = null;
    }

    ui.btnNav.addEventListener('click', () => {
      if (!cur) { alert('Vehicle not located yet — wait for a GPS fix.'); return; }
      if (activeRoute) {
        clearRoute();
        ui.btnNav.innerText  = 'Take Me To Car';
        ui.btnNav.className  = 'btn btn-primary';
      } else {
        drawRoute(cur.x, cur.y);
        ui.btnNav.innerText  = 'Stop Navigation';
        ui.btnNav.className  = 'btn btn-stop';
      }
    });

    // render loop — smooth interpolation runs at rAF rate
    function tick() {
      const state = stepInterp();
      if (state) {
        ui.marker.style.transform = `translate(${state.x}px, ${state.y}px)`;
        ui.marker.style.display   = 'block';
        ui.carBody.style.transform = `rotate(${state.heading}deg)`;
        ui.accCircle.setAttribute('cx', state.x);
        ui.accCircle.setAttribute('cy', state.y);
        ui.accCircle.setAttribute('r',  Math.max(12, state.accR));
        ui.accCircle.style.display = 'block';
        setStatus(state.status);
      }
      requestAnimationFrame(tick);
    }

    function connect(url, key) {
      if (!url || !key) return;
      if (rtChannel) { rtChannel.unsubscribe(); rtChannel = null; }
      supabase = createClient(url, key, { auth: { persistSession: false } });
      fetchInitial();
      subscribeRT();
    }

    ui.cfgConnect.addEventListener('click', () => {
      const url = ui.cfgUrl.value.trim();
      const key = ui.cfgKey.value.trim();
      if (!url || !key) { alert('Please enter both Supabase URL and Anon Key.'); return; }
      ui.cfgOverlay.style.display = 'none';
      connect(url, key);
    });

    // if URL params were provided, skip the overlay entirely
    if (p.get('url') && p.get('key')) {
      ui.cfgOverlay.style.display = 'none';
      connect(p.get('url'), p.get('key'));
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
