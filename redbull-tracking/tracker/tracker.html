<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CampusLink — Red Bull Car Transmitter</title>
  <style>
    :root {
      --bg: #05070c;
      --card: #0d131f;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #64748b;
      --accent: #dc2626;
      --accent-glow: rgba(220, 38, 38, 0.3);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --amber: #f59e0b;
      --mono: 'JetBrains Mono', Consolas, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      font-family: var(--mono);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-green { background: var(--green-glow); color: var(--green); border: 1px solid var(--green); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid var(--amber); }
    .badge-red { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); }
    .badge-muted { background: #1e293b; color: var(--muted); border: 1px solid var(--border); }
    .pulse { animation: pulse 1.8s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .cockpit {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .cockpit-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .cockpit-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .cockpit-val {
      font-size: 20px;
      font-weight: 800;
      font-family: var(--mono);
      color: #fff;
    }
    .cockpit-val-sm {
      font-size: 14px;
    }
    .config-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .config-card h2 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .input-group {
      margin-bottom: 10px;
    }
    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: #05070c;
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #e11d48;
      color: white;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
    }
    .btn-danger {
      background: #27272a;
      color: #ef4444;
      border: 1px solid #ef4444;
    }
    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      font-size: 12px;
      padding: 10px;
    }
    .error-banner {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid var(--accent);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--mono);
      margin-bottom: 14px;
      display: none;
    }
    .footer-stats {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span style="color: #e11d48;">●</span>
      <span>Red Bull Car Transmitter</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <span id="wakeLockBadge" class="badge badge-muted">WakeLock: OFF</span>
      <span id="statusBadge" class="badge badge-muted">STANDBY</span>
    </div>
  </div>

  <div id="errorLog" class="error-banner"></div>

  <div class="cockpit">
    <div class="cockpit-card">
      <div class="cockpit-label">Speed</div>
      <div class="cockpit-val" id="statSpeed">--</div>
    </div>
    <div class="cockpit-card">
      <div class="cockpit-label">Heading</div>
      <div class="cockpit-val" id="statHeading">--</div>
    </div>
    <div class="cockpit-card">
      <div class="cockpit-label">GPS Accuracy</div>
      <div class="cockpit-val" id="statAccuracy">--</div>
    </div>
    <div class="cockpit-card">
      <div class="cockpit-label">Packets Sent</div>
      <div class="cockpit-val" id="statSentCount">0</div>
    </div>
    <div class="cockpit-card" style="grid-column: span 2;">
      <div class="cockpit-label">Current Geolocation (Lat, Lng)</div>
      <div class="cockpit-val cockpit-val-sm">
        <span id="statLat">0.0000000</span>, <span id="statLng">0.0000000</span>
      </div>
    </div>
  </div>

  <button id="btnToggle" class="btn btn-primary">Start Live Transmission</button>
  <button id="btnManualPulse" class="btn btn-secondary">Send Single Manual Pulse</button>

  <div class="config-card">
    <h2>Transmitter Settings</h2>
    <div class="input-group">
      <label>Device Label</label>
      <input type="text" id="deviceLabel" value="REDBULL_CAR_01">
    </div>
    <div class="input-group">
      <label>Tracker Secret Token</label>
      <input type="password" id="secretToken" placeholder="Enter vehicle secret token">
    </div>
    <div class="input-group">
      <label>Supabase URL</label>
      <input type="text" id="supabaseUrl" placeholder="https://xyz.supabase.co">
    </div>
    <div class="input-group">
      <label>Supabase Anon Key</label>
      <input type="password" id="supabaseKey" placeholder="eyJhbGciOi...">
    </div>
  </div>

  <div class="footer-stats">
    <span>Last Pulse: <strong id="statLastSent" style="color: #fff;">--</strong></span>
    <span>CampusLink Kiosk Node</span>
  </div>

  <script type="module">
    import { initTracker } from './tracker.js';
    initTracker();
  </script>
</body>
</html>
